<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати гру - Steam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Додати нову гру</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Назва гри</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Статус</label>
                    <select name="status" class="form-select">
                        <option value="Installed">Installed</option>
                        <option value="In Library">In Library</option>
                        <option value="Running">Running</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ціна (0 для безкоштовної)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="0">
                </div>
                <button type="submit" class="btn btn-success">Зберегти</button>
                <a href="/" class="btn btn-secondary">Скасувати</a>
            </form>
        </div>
    </div>
</body>
</html>
