<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати гру - Steam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Редагувати: {{ game.title }}</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Назва гри</label>
                    <input type="text" name="title" class="form-control" value="{{ game.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Статус</label>
                    <input type="text" name="status" class="form-control" value="{{ game.status }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ціна</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ game.price }}">
                </div>
                <button type="submit" class="btn btn-primary">Оновити</button>
                <a href="/" class="btn btn-secondary">Назад</a>
            </form>
        </div>
    </div>
</body>
</html>
