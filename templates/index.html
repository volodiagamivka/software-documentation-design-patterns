<!DOCTYPE html>
<html>
<head>
    <title>Steam Game Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1>Список ігор STEAM</h1>
    <a href="/add" class="btn btn-success mb-3">Додати гру</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Статус</th>
                <th>Ціна</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            {% for game in games %}
            <tr>
                <td>{{ game.id }}</td>
                <td>{{ game.title }}</td>
                <td>{{ game.status }}</td>
                <td>{{ game.price }}$</td>
                <td>
                    <a href="/edit/{{ game.id }}" class="btn btn-sm btn-primary">Редагувати</a>
                    <a href="/delete/{{ game.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Ви впевнені?')">Видалити</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
